[project]
name = "pneumoniamnist-takehome"
random_seed = 42
threads = 1

[paths]
data_dir = "data"
output_dir = "output"
dataset = "data/pneumoniamnist.npz"
database = "data/pneumoniamnist.duckdb"
metadata_csv = "data/pneumoniamnist_metadata.csv"
analysis_sql = "sql/analysis.sql"

[outputs]
logs = "output/logs"
analysis = "output/analysis"
models = "output/models"
predictions = "output/predictions"
model_selection = "output/model_selection"
shap = "output/shap"
mlflow = "output/mlflow"
temp = "output/tmp"
splits = "output/splits"

[qc]
expected_height = 28
expected_width = 28
low_variance_quantile = 0.01

[modeling]
# Hyperparameter tuning for all three models (logistic, SVM, XGBoost):
# false (default): each candidate is fit on train and scored on the
#   validation split -- a plain train/val/test holdout.
# true: candidates are scored by stratified k-fold CV inside the training
#   split (cv_folds folds). Override per run with --cv / --no-cv.
# Either way the final model is fit on train only and test is scored once.
cross_validation = false
cv_folds = 3
search_iterations = 8
threshold_method = "youden_j"

[splits]
# Pool the official train/val/test arrays, remove exact duplicate images,
# then re-split with a seeded stratified split. Set deduplicate = false to
# use the official MedMNIST splits unchanged (benchmark comparability).
deduplicate = true
# "drop": remove every copy of a duplicate group whose labels disagree.
# "keep_first": keep the first copy and its label.
label_conflict_policy = "drop"
# true: val/test sizes follow the official split proportions.
# false: use val_fraction and test_fraction below.
preserve_source_proportions = true
val_fraction = 0.1
test_fraction = 0.1

[mlflow]
# Track every training run in the local store under output/mlflow.
# Override per run with --mlflow / --no-mlflow.
enabled = true
baseline_experiment = "pneumoniamnist"
experiments_experiment = "pneumoniamnist_experiments"

[app]
# Model used to classify images in the catalog and the Streamlit app:
# "logistic", "svm", "xgboost", or "best" (the winner recorded by
# src/select_best_model.py). Override per run with IMAGE_EXPLORER_MODEL.
# After switching, run `python src/image_pipeline.py --rescore` (run_all.py
# does this automatically) so stored predictions match the new model.
model = "logistic"

[shap]
background_size = 100
default_output_format = "png"

[augmentation]
enabled = false
copies_per_image = 1
rotate_limit_degrees = 5.0
translate_limit_fraction = 0.03
scale_limit_fraction = 0.03
brightness_limit = 0.05
contrast_limit = 0.05
probability = 0.5

[theme]
base = "light"
primaryColor = "#2563eb"
backgroundColor = "#f7f8fa"
secondaryBackgroundColor = "#eef1f5"
textColor = "#1e293b"
